<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy Safety QR Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Cairo', sans-serif;
    padding: 20px;
  }

  .poster {
    width: 420px;
    background: linear-gradient(160deg, #020d08 0%, #041a0e 50%, #020d08 100%);
    border: 1px solid rgba(0,255,136,0.2);
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 60px rgba(0,255,136,0.08),
      0 0 120px rgba(0,200,255,0.04),
      inset 0 1px 0 rgba(0,255,136,0.15);
  }

  /* animated grid bg */
  .poster::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  /* glowing orb top */
  .orb-top {
    position: absolute;
    top: -80px; left: 50%;
    transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(0,255,136,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .orb-bottom {
    position: absolute;
    bottom: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(0,200,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .inner { position: relative; z-index: 1; padding: 32px 28px 28px; }

  /* top badge */
  .dept-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .dept-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,200,255,0.4), transparent);
  }

  .dept-text {
    color: rgba(0,200,255,0.8);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* shield icon */
  .shield-wrap {
    text-align: center;
    margin: 18px 0 10px;
    position: relative;
  }

  .shield-svg {
    width: 64px;
    height: 64px;
    filter: drop-shadow(0 0 16px rgba(0,255,136,0.5));
    animation: floatShield 3s ease-in-out infinite;
  }

  @keyframes floatShield {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* pulse ring around shield */
  .pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,255,136,0.3);
    animation: ringPulse 2s ease-out infinite;
  }

  .pulse-ring:nth-child(2) { animation-delay: 0.7s; }

  @keyframes ringPulse {
    0% { transform: translate(-50%,-50%) scale(0.9); opacity: 0.8; }
    100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
  }

  /* title */
  .title-ar {
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(135deg, #00ff88, #00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .title-en {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: rgba(0,255,136,0.6);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    font-family: 'Tajawal', sans-serif;
  }

  /* divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .div-line { flex:1; height:1px; background: linear-gradient(90deg, transparent, rgba(0,255,136,0.25), transparent); }
  .div-icon { font-size: 16px; }

  /* QR container */
  .qr-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .qr-frame {
    position: relative;
    padding: 14px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow:
      0 0 0 2px rgba(0,255,136,0.4),
      0 0 30px rgba(0,255,136,0.2),
      0 0 60px rgba(0,255,136,0.08);
  }

  /* corner accents */
  .qr-frame::before, .qr-frame::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: #00ff88;
    border-style: solid;
  }
  .qr-frame::before { top: -3px; left: -3px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
  .qr-frame::after  { bottom: -3px; right: -3px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

  .corner-tr {
    position: absolute;
    top: -3px; right: -3px;
    width: 20px; height: 20px;
    border: 3px solid #00ff88;
    border-width: 3px 3px 0 0;
    border-radius: 0 4px 0 0;
  }
  .corner-bl {
    position: absolute;
    bottom: -3px; left: -3px;
    width: 20px; height: 20px;
    border: 3px solid #00ff88;
    border-width: 0 0 3px 3px;
    border-radius: 0 0 0 4px;
  }

  #qrcode canvas, #qrcode img {
    border-radius: 6px;
    display: block;
  }

  /* scan cta */
  .scan-cta {
    text-align: center;
    margin-bottom: 18px;
  }

  .scan-arrow {
    font-size: 22px;
    display: block;
    margin-bottom: 4px;
    animation: bounceArrow 1.5s ease-in-out infinite;
  }

  @keyframes bounceArrow {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .scan-text-ar {
    font-size: 16px;
    font-weight: 900;
    color: #e0ffe8;
    display: block;
    margin-bottom: 3px;
  }

  .scan-text-en {
    font-size: 11px;
    font-weight: 600;
    color: rgba(0,255,136,0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* pills row */
  .pills {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .pill {
    background: rgba(0,255,136,0.07);
    border: 1px solid rgba(0,255,136,0.2);
    border-radius: 50px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 700;
    color: rgba(0,255,136,0.7);
    text-align: center;
    line-height: 1.6;
  }
  .pill-en {
    display: block;
    font-size: 9px;
    font-weight: 600;
    color: rgba(0,255,136,0.45);
    letter-spacing: 0.5px;
  }

  /* footer */
  .footer {
    border-top: 1px solid rgba(0,255,136,0.1);
    padding-top: 14px;
    text-align: center;
  }

  .footer-date {
    font-size: 11px;
    color: rgba(224,255,232,0.35);
    letter-spacing: 1px;
  }

  .footer-campaign {
    font-size: 12px;
    font-weight: 700;
    color: rgba(0,200,255,0.5);
    letter-spacing: 1px;
    margin-top: 3px;
  }

  /* print button */
  .print-btn {
    display: block;
    margin: 24px auto 0;
    background: linear-gradient(135deg, #00ff88, #00cc66);
    border: none;
    border-radius: 50px;
    padding: 12px 36px;
    color: #030f0a;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 24px rgba(0,255,136,0.3);
  }

  .print-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0,255,136,0.45);
  }

  @media print {
    body { background: white; padding: 0; }
    .poster {
      background: white !important;
      border: 2px solid #00cc66;
      box-shadow: none;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
    .poster::before { display: none; }
    .orb-top, .orb-bottom { display: none; }
    .title-ar { color: #006633 !important; -webkit-text-fill-color: #006633 !important; }
    .print-btn { display: none; }
    .dept-text { color: #0066aa; }
    .pill { border-color: #00cc66; color: #006633; }
    .footer-date { color: #999; }
    .footer-campaign { color: #0066aa; }
    .scan-text-ar { color: #111; }
    .scan-text-en { color: #006633; }
    .div-line { background: #ccc; }
  }
</style>
</head>
<body>

<div>
  <div class="poster">
    <div class="orb-top"></div>
    <div class="orb-bottom"></div>
    <div class="inner">

      <!-- dept -->
      <div class="dept-badge">
        <div class="dept-line"></div>
        <div class="dept-text">🏥 Pharmaceutical Care Services</div>
        <div class="dept-line"></div>
      </div>

      <!-- shield -->
      <div class="shield-wrap">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <svg class="shield-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 4L8 14V30C8 44 18 56 32 60C46 56 56 44 56 30V14L32 4Z"
            fill="rgba(0,255,136,0.12)" stroke="#00ff88" stroke-width="2"/>
          <path d="M32 4L8 14V30C8 44 18 56 32 60C46 56 56 44 56 30V14L32 4Z"
            fill="none" stroke="rgba(0,255,136,0.3)" stroke-width="6"/>
          <!-- pill cross -->
          <rect x="28" y="20" width="8" height="24" rx="4" fill="#00ff88"/>
          <rect x="20" y="28" width="24" height="8" rx="4" fill="#00ff88"/>
        </svg>
      </div>

      <!-- titles -->
      <div class="title-ar">تحدي غرفة الهروب الدوائية</div>
      <div class="title-en">Pharmacy Escape Room</div>

      <div class="divider">
        <div class="div-line"></div>
        <div class="div-icon">💊</div>
        <div class="div-line"></div>
      </div>

      <!-- QR -->
      <div class="qr-wrap">
        <div class="qr-frame">
          <div class="corner-tr"></div>
          <div class="corner-bl"></div>
          <div id="qrcode"></div>
        </div>
      </div>

      <!-- scan cta -->
      <div class="scan-cta">
        <span class="scan-arrow">📱</span>
        <span class="scan-text-ar">امسح الباركود وابدأ التحدي الآن!</span>
        <span class="scan-text-en">Scan to Start the Challenge Now</span>
      </div>

      <!-- pills -->
      <div class="pills">
        <div class="pill">⏱ 90 ثانية<br><span class="pill-en">90 Seconds</span></div>
        <div class="pill">❓ 8 أسئلة<br><span class="pill-en">8 Questions</span></div>
        <div class="pill">💊 سلامة الدواء<br><span class="pill-en">Medication Safety Focus</span></div>
      </div>

      <!-- footer -->
      <div class="footer">
        <div class="footer-campaign">🛡️ Medication Safety Campaign</div>
        <div class="footer-date">6-7 May 2026</div>
      </div>

    </div>
  </div>

<script>
new QRCode(document.getElementById("qrcode"), {
  text: "https://y6shytstcv-source.github.io/mimi-escape-room/",
  width: 200,
  height: 200,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
